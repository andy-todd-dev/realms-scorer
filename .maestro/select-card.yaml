appId: dev.andytodd.realmsscorer
---
- runFlow: subflows/open-app.yaml

# The app opens on the grid with an empty hand, scored through the real wiring.
# The long wait covers Metro's first bundle on debug builds.
- extendedWaitUntil:
    visible:
      id: card-grid
    timeout: 60000
- assertVisible: "Tap cards or scan"
- assertVisible:
    id: hand-score
    text: "0"

# With an empty hand there is nothing to clear or break down, and scanning isn't implemented yet
- assertVisible:
    id: clear-hand
    enabled: false
- assertVisible:
    id: scan-hand
    enabled: false
- assertVisible:
    id: show-breakdown
    enabled: false

# Cards load through the real wiring. Leaders are partway down the alphabetical list, so scroll to
# them. Centring keeps the tiles clear of the score bar.
- scrollUntilVisible:
    element:
      id: card-tile-king
    direction: DOWN
    centerElement: true
- assertVisible:
    id: card-tile-queen

# Tapping King adds it, stays on the grid and scores it
- tapOn:
    id: card-tile-king
- assertVisible: "1 of 7 cards"
- assertVisible:
    id: hand-score
    text: "8"

# Tapping King again removes it, then a third tap adds it back
- tapOn:
    id: card-tile-king
- assertVisible: "Tap cards or scan"
- assertVisible:
    id: hand-score
    text: "0"
- tapOn:
    id: card-tile-king
- assertVisible: "1 of 7 cards"

# Adding Queen scores both, and the breakdown shows each card's total through the real wiring.
# Without an Army, neither bonus applies.
- tapOn:
    id: card-tile-queen
- assertVisible: "2 of 7 cards"
- assertVisible:
    id: hand-score
    text: "14"
- tapOn:
    id: show-breakdown
- assertVisible:
    id: breakdown-total
    text: "14"
- assertVisible:
    id: breakdown-warning
    text: "2 of 7 cards"
- assertVisible:
    id: card-total-king
    text: "8"
- assertVisible:
    id: card-total-queen
    text: "6"

# Cards are listed highest-scoring first, so King (8) comes above Queen (6)
- assertVisible:
    id: breakdown-card-queen
    below:
      id: breakdown-card-king

# Removing King on the breakdown updates it in place and rescores
- tapOn:
    id: remove-card-king
- assertNotVisible:
    id: breakdown-card-king
- assertVisible:
    id: breakdown-card-queen
- assertVisible:
    id: breakdown-total
    text: "6"

# Back returns to the grid, where it was left, with the remaining hand intact
- tapOn:
    id: back-to-cards
- assertVisible:
    id: card-tile-king
- assertVisible: "1 of 7 cards"

# The header hid when the grid scrolled down to the Leaders, and scrolling up brings it back.
# Clear empties the hand for the next game, and is disabled once there's nothing to clear
- scrollUntilVisible:
    element:
      id: clear-hand
    direction: UP
- tapOn:
    id: clear-hand
- assertVisible: "Tap cards or scan"
- assertVisible:
    id: hand-score
    text: "0"
- assertVisible:
    id: clear-hand
    enabled: false
