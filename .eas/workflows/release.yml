# Runs when a GitHub release is published, as publishing creates the release's tag (e.g. 0.3.0).
# The type check and tests run first, and a failure stops the build and submit.
name: Release to Play internal testing

on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
      # Pre-releases such as 0.3.0-rc.1 are not shipped.
      - "!*-*"

defaults:
  tools:
    # Keep in step with the build profile in eas.json, so the tests run on the Node the app is built with.
    node: 26.13.0

jobs:
  test:
    name: Run tests
    if: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: eas/checkout
      # The image's older npm rejects the lock file, as for submit_android below.
      - run: npm install -g npm@11.20.0
      - uses: eas/install_node_modules
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --ci

  build_android:
    name: Build Android
    type: build
    needs: [test]
    if: ${{ github.ref_type == 'tag' }}
    env:
      # The tag becomes the app version, without any leading v.
      APP_VERSION: ${{ replaceAll(github.ref_name, 'v', '') }}
    params:
      platform: android
      profile: production
      message: Release ${{ github.ref_name }}

  submit_android:
    name: Submit to Play internal testing
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
    hooks:
      # Submit profiles can't pin Node as build profiles do, and the image's older npm rejects the lock file.
      # Keep this in step with the npm that comes with the Node version in eas.json and the devcontainer.
      before_install_node_modules:
        - run: npm install -g npm@11.20.0
